<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор для ЛР 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            background: #f4f4f9;
        }

        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }

        .display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding-right: 10px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #e0e0e0;
        }

            button:hover {
                background: #d0d0d0;
            }

        .operator {
            background: #f8a13e;
            color: white;
        }

            .operator:hover {
                background: #e08e2f;
            }

        .equal {
            background: #4a90e2;
            color: white;
            grid-column: span 2;
        }

            .equal:hover {
                background: #357ab8;
            }

        .clear {
            background: #e74c3c;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" class="display" value="0" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="appendValue('/')" class="operator">÷</button>
            <button onclick="appendValue('*')" class="operator">×</button>
            <button onclick="appendValue('-')" class="operator">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="equal">=</button>

            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('**')" class="operator">x^y</button>
        </div>
    </div>

    <script>
    let currentInput = '0';
    let shouldResetDisplay = false;

    function updateDisplay() {
        document.getElementById('display').value = currentInput;
    }

    function appendValue(value) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = value;
            shouldResetDisplay = false;
        } else {
            currentInput += value;
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        updateDisplay();
    }

    function calculate() {
        try {
            // БАГ №1: Использование eval может привести к выполнению чужого кода, если передать в инпут спецсимволы
            let result = eval(currentInput);

            // БАГ №2: Деление на ноль выдает Infinity, а не сообщение об ошибке "Деление на ноль невозможно"
            if (result === Infinity || result === -Infinity) {
                currentInput = "Infinity";
            } else {
                currentInput = String(result);
            }
        } catch (e) {
            currentInput = "Ошибка";
        }
        shouldResetDisplay = true;
        updateDisplay();
    }
    </script>

</body>
</html>
